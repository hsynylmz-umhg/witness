# Experimental offline-ingest settings, not provider capabilities or validated thresholds.
[media]
candidate_sample_fps = 5.0
max_file_bytes = 1073741824
max_duration_seconds = 300.0
max_frame_count = 20000
probe_timeout_seconds = 60.0

# Estimator candidates only; require real-media calibration.
[detection]
min_rotation_deg = 45.0
movement_delta_deg = 2.0
stop_delta_deg = 1.5
stop_centroid_px = 3.0
min_stop_samples = 3
min_stop_seconds = 0.4
max_gap_seconds = 0.3
max_axis_step_deg = 60.0
max_event_seconds = 10.0
min_pixels = 12
min_elongation = 2.5
min_area_ratio = 0.4
area_history_samples = 5
numeric_tolerance_deg = 0.000000001

[budget]
max_usd = 0.0
credits_confirmed = false

# Published prices; local request/resource limits are not provider guarantees.
[sam]
image_usd_per_1000 = "2.50"
video_frame_usd_per_1000 = "0.20"
min_video_frames_per_request = 50
timeout_seconds = 60.0
max_image_bytes = 10485760
max_response_bytes = 2097152
