    <path class="rim" data-pen="2" d="M 526.4 244.8 A 60.7 60.7 0 0 1 526.4 123.4"/>
    <path class="rim" data-pen="4" d="M 866.0 245.6 A 60.7 60.7 0 0 1 866.0 124.2"/>
    <path class="rim" data-pen="1" d="M 163.6 899.7 A 66.3 66.3 0 0 1 163.6 767.1"/>
