    <line class="rim" data-pen="1" x1="139.8" y1="184.8" x2="139.8" y2="834.0" stroke="#3B80DE" stroke-width="6"/>
    <line class="rod" data-pen="3" x1="522.0" y1="184.8" x2="522.0" y2="834.0" stroke="url(#witness-ramp)" stroke-width="50.6" stroke-linecap="round"/>
    <line class="rim" data-pen="3" x1="499.7" y1="184.8" x2="499.7" y2="834.0" stroke="#3B80DE" stroke-width="6"/>
    <line class="rod" data-pen="2" x1="162.1" y1="834.0" x2="537.6" y2="184.8" stroke="url(#witness-ramp)" stroke-width="50.6" stroke-linecap="round"/>
    <line class="rim" data-pen="2" x1="142.8" y1="822.8" x2="518.2" y2="173.6" stroke="#3B80DE" stroke-width="6"/>
    <line class="rod" data-pen="4" x1="511.6" y1="834.0" x2="882.7" y2="184.8" stroke="url(#witness-ramp)" stroke-width="50.6" stroke-linecap="round"/>
    <line class="rim" data-pen="4" x1="492.2" y1="822.9" x2="863.3" y2="173.7" stroke="#3B80DE" stroke-width="6"/>
  </g>
  <g fill="url(#witness-ramp)">
    <circle class="joint" data-pen="0" cx="162.7" cy="185.4" r="63.7"/>
    <circle class="joint" data-pen="2" cx="526.4" cy="184.1" r="63.7"/>
    <circle class="joint" data-pen="4" cx="866.0" cy="184.9" r="63.7"/>
