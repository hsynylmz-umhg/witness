<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>witness</title>
  <!--
    Traced in round 18 from the operator's raster reference, measured pixel by pixel: four rods and
    five joints. Rod width 50.6 (6.1% of the mark's 835-unit width). Upper joints r 63.7, lower
    joints r 69.3: 2.5x and 2.7x the rod half-width. The gradient runs from the reference's deep navy
    at the base to its azure at the crown. One specular pass: a narrow #3B80DE rim on the left edge
    of each rod and joint. Rods and joints are listed in depth order; data-pen is the order in which
    the film draws them.
  -->
  <defs>
    <linearGradient id="witness-ramp" gradientUnits="userSpaceOnUse" x1="512" y1="903.8" x2="512" y2="120.3">
      <stop offset="0" stop-color="#01112F"/>
      <stop offset="1" stop-color="#194C9E"/>
